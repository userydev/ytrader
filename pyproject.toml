[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytrader"
version = "0.1.0"
description = "Evidence-first Chinese investment research API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "defusedxml>=0.7,<1", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
akshare = ["akshare>=1.15"]

[project.scripts]
ytrader = "backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
